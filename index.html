<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Échecs entre amis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<link rel="stylesheet" href="style.css"></head>
<body><main>
<h1><span>♞ Échecs entre amis</span><button class="sec" id="out" hidden>Déconnexion</button></h1>
<p id="msg"></p>

<section id="auth" hidden>
  <div class="card"><h2>Connexion / création de compte</h2>
    <div class="row"><input id="user" placeholder="Pseudo (pour créer un compte)"></div>
    <div class="row"><input id="email" type="email" placeholder="Email"></div>
    <div class="row"><input id="pass" type="password" placeholder="Mot de passe (6+ caractères)"></div>
    <div class="row"><button id="login">Se connecter</button><button class="sec" id="signup">Créer un compte</button></div>
    <div class="row"><button class="sec" id="google">Continuer avec Google</button></div>
  </div>
</section>

<section id="home" hidden>
  <div class="card"><h2>Jouer contre un bot</h2>
    <div class="row">
      <select id="lvl"><option value="1">Débutant</option><option value="2">Facile</option><option value="3" selected>Moyen</option><option value="4">Fort</option></select>
      <select id="col"><option value="r">Couleur au hasard</option><option value="w">Blancs</option><option value="b">Noirs</option></select>
      <button id="bot">Jouer</button>
    </div>
  </div>
  <div class="card"><h2>Lancer un défi</h2>
    <div class="row">
      <select id="tc"><option value="60,0">Bullet 1 min</option><option value="180,2">Blitz 3+2</option><option value="600,0" selected>10 minutes</option><option value="3600,0">1 heure</option></select>
      <select id="mode"><option value="std">Partie normale</option><option value="hq">Mini-jeu : la dame cachée</option></select>
      <button id="chal">Défier</button>
    </div>
    <div class="small">Le défi apparaît chez tous les joueurs connectés. Tu peux aussi envoyer le lien de la partie à un ami.</div>
  </div>
  <div class="card"><h2>Mes amis</h2>
    <div class="row"><span>Ton code : <b id="mycode">····</b></span></div>
    <div class="row"><input id="fcode" maxlength="4" inputmode="numeric" placeholder="Code à 4 chiffres"><button id="fadd">Ajouter</button></div>
    <div class="list" id="friends"></div>
  </div>
  <div class="card"><h2>Classement</h2><div class="list" id="rank"></div></div>
  <div class="card"><h2>Défis ouverts</h2><div class="list" id="open"></div></div>
  <div class="card"><h2>Mes parties en cours</h2><div class="list" id="mine"></div></div>
</section>

<section id="game" hidden>
  <div class="card">
    <div class="clock"><span id="oppn"></span><b id="oppc"></b></div>
    <div id="board"><div id="promo"></div></div>
    <div class="clock"><span id="myn"></span><b id="myc"></b></div>
    <p id="info"></p>
    <p class="small" id="link"></p>
    <div id="ana"></div>
    <div class="row"><button id="analyse" hidden>Analyser la partie</button><button class="sec" id="resign">Abandonner</button><button class="sec" id="back">Retour</button></div>
  </div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {firebaseConfig} from "./config.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,signOut,GoogleAuthProvider,signInWithPopup} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,collection,query,where,onSnapshot,runTransaction,writeBatch,increment,arrayUnion,orderBy,limit,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
/* ========================================================================================= */
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const PC={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const msg=t=>$('msg').textContent=t||'';
const show=v=>['auth','home','game'].forEach(x=>$(x).hidden=x!==v);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,G=null,sel=null,unsubG=null,unsubL=null,pendingName='';

/* ---------- comptes ---------- */
const profs={};
function ensureProfile(u,name){
  return profs[u.uid]||(profs[u.uid]=(async()=>{
    const r=doc(db,'users',u.uid),s=await getDoc(r);
    if(s.exists())return s.data();
    const nm=name||u.displayName||u.email.split('@')[0];
    for(let i=0;i<40;i++){
      const code=String(Math.floor(Math.random()*10000)).padStart(4,'0');
      try{await setDoc(doc(db,'codes',code),{uid:u.uid})}catch(e){continue}   // refusé si le code existe déjà
      const p={name:nm,code,wins:0,played:0};await setDoc(r,p);return p;
    }
    throw new Error('plus de code libre');
  })());
}
onAuthStateChanged(auth,async u=>{
  if(!u){me=null;$('out').hidden=true;show('auth');return}
  try{const p=await ensureProfile(u,pendingName);me={id:u.uid,name:p.name,code:p.code}}
  catch(e){msg('Erreur de profil : '+e.message);return}
  $('out').hidden=false;
  if(location.hash.startsWith('#g='))openGame(location.hash.slice(3));else goHome();
});
const fbErr=e=>({'auth/invalid-credential':'Email ou mot de passe incorrect.','auth/email-already-in-use':'Cet email a déjà un compte.','auth/weak-password':'Mot de passe trop court (6 caractères minimum).','auth/invalid-email':'Email invalide.'}[e.code]||e.message);
$('login').onclick=async()=>{try{msg('');await signInWithEmailAndPassword(auth,$('email').value,$('pass').value)}catch(e){msg(fbErr(e))}};
$('signup').onclick=async()=>{
  const name=$('user').value.trim();if(!name)return msg('Choisis un pseudo.');
  pendingName=name;
  try{const c=await createUserWithEmailAndPassword(auth,$('email').value,$('pass').value);await updateProfile(c.user,{displayName:name})}
  catch(e){pendingName='';msg(fbErr(e))}
};
$('out').onclick=()=>signOut(auth);
$('google').onclick=async()=>{
  try{msg('');await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')msg(fbErr(e))}
};

/* ---------- accueil / défis ---------- */
const tcName=g=>g.tc_base>=3600?'1 heure':g.tc_base===60?'Bullet 1 min':g.tc_base===180?'Blitz 3+2':(g.tc_base/60)+' minutes';
function addRow(box,html,label,fn){
  const d=document.createElement('div');d.innerHTML=`<span>${html}</span>`;
  const b=document.createElement('button');b.textContent=label;b.onclick=fn;d.appendChild(b);box.appendChild(d);
}
function goHome(){
  G=null;location.hash='';show('home');
  if(unsubG){unsubG();unsubG=null}
  if(unsubL)unsubL();
  unsubL=onSnapshot(query(collection(db,'games'),where('status','in',['open','active'])),
    s=>lobby(s.docs.map(d=>({id:d.id,...d.data()}))),e=>msg('Erreur : '+e.message));
  loadSocial();
}
function lobby(all){
  const o=$('open'),m=$('mine');o.innerHTML='';m.innerHTML='';
  all.filter(g=>g.status==='open'&&(!g.invited||g.invited===me.id||g.players.includes(me.id)))
    .sort((a,b)=>b.created-a.created).forEach(g=>addRow(o,
      `${esc(g.white_name||g.black_name)} · ${tcName(g)}${g.mode==='hq'?' · dame cachée':''}${g.invited?' · défi privé':''}`,
      g.players.includes(me.id)?'Ouvrir':'Accepter',()=>openGame(g.id)));
  all.filter(g=>g.status==='active'&&g.players.includes(me.id))
    .forEach(g=>addRow(m,`${esc(g.white_name)} contre ${esc(g.black_name)} · ${tcName(g)}`,'Reprendre',()=>openGame(g.id)));
  if(!o.children.length)o.textContent='Aucun défi pour le moment.';
  if(!m.children.length)m.textContent='Aucune partie en cours.';
}
$('chal').onclick=()=>challenge();
async function challenge(inv){
  const [base,inc]=$('tc').value.split(',').map(Number),w=Math.random()<.5;
  const g={fen:new Chess().fen(),tc_base:base,tc_inc:inc,white_ms:base*1000,black_ms:base*1000,last_at:0,status:'open',
    mode:$('mode').value,moves:'',invited:inv||null,created:Date.now(),players:[me.id],
    white:w?me.id:null,black:w?null:me.id,white_name:w?me.name:'',black_name:w?'':me.name,
    winner:null,result:'',hq_w:'',hq_b:'',rev_w:false,rev_b:false};
  try{const r=await addDoc(collection(db,'games'),g);openGame(r.id)}
  catch(e){msg('Impossible de créer le défi : '+e.message)}
}

/* ---------- partie en ligne ---------- */
async function openGame(id){
  msg('');
  const ref=doc(db,'games',id);
  try{
    await runTransaction(db,async t=>{
      const s=await t.get(ref);if(!s.exists())throw new Error('Partie introuvable.');
      const g=s.data();
      if(g.status==='open'&&!g.players.includes(me.id)){
        const p={status:'active',last_at:Date.now(),players:arrayUnion(me.id)};
        if(!g.white){p.white=me.id;p.white_name=me.name}else{p.black=me.id;p.black_name=me.name}
        t.update(ref,p);
      }
    });
  }catch(e){msg(e.message);return goHome()}
  location.hash='g='+id;resetAna();
  if(unsubL){unsubL();unsubL=null}
  if(unsubG)unsubG();
  unsubG=onSnapshot(ref,s=>{if(s.exists())startOnline({id:s.id,...s.data()})},e=>msg(e.message));
}
// Position réelle : en mode dame cachée, on ajoute les deux dames avant le 1er coup
function trueBoard(r){
  const c=new Chess(r.fen);
  if(r.mode==='hq'&&r.hq_w&&r.hq_b&&!r.moves){c.put({type:'q',color:'w'},r.hq_w);c.put({type:'q',color:'b'},r.hq_b)}
  return c;
}
function startOnline(row){
  G={mode:'online',row,c:trueBoard(row),side:row.white===me.id?'w':row.black===me.id?'b':null};
  sel=null;show('game');render();
}

/* ---------- bots ---------- */
const V={p:100,n:320,b:330,r:500,q:900,k:0};
function ev(c){let s=0;for(const r of c.board())for(const p of r)if(p)s+=(p.color==='w'?1:-1)*V[p.type];return s}
function ab(c,d,a,b){
  if(d===0)return ev(c);
  const ms=c.moves();
  if(!ms.length)return c.in_checkmate()?(c.turn()==='w'?-1e5-d:1e5+d):0;
  ms.sort((x,y)=>y.includes('x')-x.includes('x'));
  let v;
  if(c.turn()==='w'){v=-1e9;for(const m of ms){c.move(m);v=Math.max(v,ab(c,d-1,a,b));c.undo();a=Math.max(a,v);if(a>=b)break}}
  else{v=1e9;for(const m of ms){c.move(m);v=Math.min(v,ab(c,d-1,a,b));c.undo();b=Math.min(b,v);if(a>=b)break}}
  return v;
}
function botMove(c,lvl){
  const ms=c.moves().sort(()=>Math.random()-.5);
  if(lvl===1||(lvl===2&&Math.random()<.3))return ms[0];
  const w=c.turn()==='w';let best=null,bv=w?-1e9:1e9;
  for(const m of ms){c.move(m);const v=ab(c,lvl-1,-1e9,1e9);c.undo();if(w?v>bv:v<bv){bv=v;best=m}}
  return best;
}
$('bot').onclick=()=>{
  let s=$('col').value;if(s==='r')s=Math.random()<.5?'w':'b';
  G={mode:'bot',c:new Chess(),side:s,lvl:+$('lvl').value,over:'',sans:[]};
  sel=null;resetAna();show('game');render();botTurn();
};
function botTurn(){
  if(G.mode!=='bot'||G.over||G.c.game_over()||G.c.turn()===G.side)return;
  $('info').textContent='Le bot réfléchit…';
  setTimeout(()=>{if(G&&G.mode==='bot'&&!G.over){G.sans.push(G.c.move(botMove(G.c,G.lvl)).san);render()}},80);
}

/* ---------- affichage ---------- */
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hqOn=()=>G.mode==='online'&&G.row.mode==='hq';
const hqReady=()=>!hqOn()||!!(G.row.hq_w&&G.row.hq_b);
function result(){
  if(G.mode==='bot'){
    if(G.over)return G.over;
    if(G.c.in_checkmate())return 'Échec et mat : '+(G.c.turn()==='w'?'les noirs':'les blancs')+' gagnent.';
    if(G.c.game_over())return 'Partie nulle.';
    return '';
  }
  return G.row.status==='finished'?G.row.result:'';
}
function clocks(){
  if(G.mode!=='online')return;
  const r=G.row,now=Date.now(),act=r.status==='active'&&hqReady();
  const t=col=>r[(col==='w'?'white':'black')+'_ms']-(act&&G.c.turn()===col&&r.last_at?now-r.last_at:0);
  const my=G.side||'w',op=my==='w'?'b':'w';
  $('myc').textContent=fmt(t(my));$('oppc').textContent=fmt(t(op));
  $('myc').className=act&&G.c.turn()===my?'on':'';$('oppc').className=act&&G.c.turn()===op?'on':'';
  for(const col of ['w','b'])if(act&&t(col)<=0&&G.side&&!G.flag){
    G.flag=1;
    save(r.id,{status:'finished',winner:col==='w'?r.black:r.white,result:'Temps écoulé : les '+(col==='w'?'noirs':'blancs')+' gagnent.'}).catch(()=>{});
  }
}
setInterval(()=>{if(G&&G.mode==='online')clocks()},250);

function render(){
  if(!G)return;
  const r=G.row,res=result(),flip=G.side==='b',hq=hqOn(),ready=hqReady();
  const picked=hq&&G.side?r['hq_'+G.side]:'x';
  if(G.mode==='bot'){
    $('oppn').textContent='Bot ('+['','Débutant','Facile','Moyen','Fort'][G.lvl]+')';$('myn').textContent=me.name;
    $('myc').textContent=$('oppc').textContent='';$('link').textContent='';
  }else{
    const my=G.side||'w';
    $('myn').textContent=(my==='w'?r.white_name:r.black_name)||'…';
    $('oppn').textContent=(my==='w'?r.black_name:r.white_name)||'En attente d\'un adversaire…';
    $('link').textContent=r.status==='open'?'Lien à envoyer : '+location.href:'';
    clocks();
  }
  const canPlay=!!G.side&&!res&&G.rv==null&&G.c.turn()===G.side&&(G.mode==='bot'||(r.status==='active'&&ready));
  let info=res||(G.mode==='online'&&r.status==='open'?'En attente d\'un adversaire…':(canPlay?'À toi de jouer'+(G.c.in_check()?' (échec !)':''):'Tour de l\'adversaire'));
  if(!res&&hq&&r.status==='active'){
    if(G.side&&!picked)info='Dame cachée : clique sur un de tes pions pour en faire ta dame secrète.';
    else if(!ready)info='En attente du choix de l\'adversaire…';
  }
  $('info').textContent=info;
  $('resign').hidden=!!res||!G.side;
  $('analyse').hidden=!res||hq||!sansOf().length;
  const b=$('board'),bd=(G.rv!=null?new Chess(G.fens[G.rv]):G.c).board(),
    tg=sel&&!hq?G.c.moves({square:sel,verbose:true}).map(m=>m.to):[];
  b.querySelectorAll('.sq').forEach(e=>e.remove());
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const y=flip?7-i:i,x=flip?7-j:j,n='abcdefgh'[x]+(8-y),d=document.createElement('div');
    let p=bd[y][x],mark=false;
    if(hq&&p&&!res&&r['hq_'+p.color]===n&&!r['rev_'+p.color]){   // dame encore cachée
      mark=G.side===p.color;p={type:'p',color:p.color};          // tout le monde voit un pion
    }
    d.className='sq '+((x+y)%2?'d':'l')+(n===sel?' sel':'')+(tg.includes(n)?' t':'')+(mark?' hq':'');
    if(p){const s=document.createElement('span');s.className=p.color;s.textContent=PC[p.type]+'\uFE0E';d.appendChild(s)}
    d.onclick=()=>click(n,canPlay);
    b.appendChild(d);
  }
}
function click(n,canPlay){
  if(hqOn()&&G.side&&G.row.status==='active'&&!G.row['hq_'+G.side]&&!result()){pickHQ(n);return}
  if(!canPlay)return;
  const ms=sel?G.c.moves({square:sel,verbose:true}).filter(m=>m.to===n):[];
  if(ms.length){if(ms[0].promotion)askPromo(sel,n);else play(sel,n);return}
  const p=G.c.get(n);
  msg(sel&&hqOn()&&!(p&&p.color===G.side)?'Coup impossible.':'');
  sel=p&&p.color===G.side?n:null;render();
}
function askPromo(from,to){
  const pr=$('promo');pr.innerHTML='';pr.style.display='flex';
  for(const t of ['q','r','b','n']){
    const bt=document.createElement('button');bt.textContent=PC[t]+'\uFE0E';
    bt.onclick=()=>{pr.style.display='none';play(from,to,t)};pr.appendChild(bt);
  }
}
async function pickHQ(n){
  const p=G.c.get(n);if(!p||p.type!=='p'||p.color!==G.side)return;
  const ref=doc(db,'games',G.row.id),mine='hq_'+G.side,other='hq_'+(G.side==='w'?'b':'w');
  try{
    await runTransaction(db,async t=>{
      const g=(await t.get(ref)).data(),u={[mine]:n};
      if(g[other])u.last_at=Date.now();   // les horloges démarrent quand les deux ont choisi
      t.update(ref,u);
    });
  }catch(e){msg('Choix non enregistré : '+e.message)}
}
// Un pion peut : avancer de 1 (ou 2 depuis sa case de départ), ou prendre en diagonale d'une case.
function pawnLike(m,col){
  const dx=Math.abs(m.to.charCodeAt(0)-m.from.charCodeAt(0)),dy=(m.to[1]-m.from[1])*(col==='w'?1:-1);
  if(m.to[1]===(col==='w'?'8':'1'))return false;
  if(dx===0)return !m.captured&&(dy===1||(dy===2&&m.from[1]===(col==='w'?'2':'7')));
  return dx===1&&dy===1&&!!m.captured;
}
async function play(from,to,promo){
  const mv=G.c.move({from,to,promotion:promo||'q'});sel=null;
  if(G.mode==='bot'){G.sans.push(mv.san);render();botTurn();return}
  const r=G.row,now=Date.now(),col=G.side,k=col==='w'?'white_ms':'black_ms';
  const patch={fen:G.c.fen(),last_at:now,moves:((r.moves||'')+' '+mv.san).trim()};
  patch[k]=r[k]-(now-r.last_at)+r.tc_inc*1000;
  if(r.mode==='hq'){
    const o=col==='w'?'b':'w';
    if(r['hq_'+col]===from){
      patch['hq_'+col]=to;
      if(!r['rev_'+col]&&!pawnLike(mv,col))patch['rev_'+col]=true;   // mouvement impossible pour un pion : elle se révèle
    }
    if(mv.captured&&r['hq_'+o]===to)patch['hq_'+o]='x';              // dame cachée adverse capturée
  }
  if(G.c.in_checkmate()){patch.status='finished';patch.winner=me.id;patch.result='Échec et mat : les '+(col==='w'?'blancs':'noirs')+' gagnent.'}
  else if(G.c.game_over()){patch.status='finished';patch.result='Partie nulle.'}
  Object.assign(G.row,patch);render();
  try{await save(r.id,patch)}catch(e){msg('Coup non enregistré : '+e.message)}
}
// Enregistre un coup ; si la partie se termine, met à jour les scores des deux joueurs dans la même opération
async function save(id,patch){
  const ref=doc(db,'games',id);
  if(patch.status!=='finished'){await updateDoc(ref,patch);return}
  const r=G.row,b=writeBatch(db);
  b.update(ref,patch);
  for(const u of [r.white,r.black]){
    const inc={played:increment(1)};if(patch.winner&&patch.winner===u)inc.wins=increment(1);
    b.update(doc(db,'users',u),inc);
  }
  await b.commit();
}
$('resign').onclick=async()=>{
  if(!confirm('Abandonner la partie ?'))return;
  if(G.mode==='bot'){G.over='Tu as abandonné.';render();return}
  const w=G.side==='w'?'noirs':'blancs';
  try{await save(G.row.id,{status:'finished',winner:G.side==='w'?G.row.black:G.row.white,result:'Abandon : les '+w+' gagnent.'})}
  catch(e){msg('Erreur : '+e.message)}
};
$('back').onclick=goHome;

/* ---------- amis & classement ---------- */
async function loadSocial(){
  $('mycode').textContent=me.code;
  const fr=$('friends'),rk=$('rank');fr.innerHTML='';rk.innerHTML='';
  const f=await getDocs(collection(db,'users',me.id,'friends'));
  f.forEach(d=>addRow(fr,esc(d.data().name),'Défier',()=>challenge(d.id)));
  if(!fr.children.length)fr.textContent='Ajoute un ami avec son code à 4 chiffres.';
  const r=await getDocs(query(collection(db,'users'),orderBy('wins','desc'),limit(10)));
  let i=0;
  r.forEach(d=>{const q=d.data();if(!q.played)return;i++;
    const e=document.createElement('div');e.innerHTML=`<span>${i}. ${esc(q.name)}</span><span>${q.wins} victoire(s) sur ${q.played} partie(s)</span>`;rk.appendChild(e)});
  if(!i)rk.textContent='Aucune partie terminée pour le moment.';
}
$('fadd').onclick=async()=>{
  try{
    const c=await getDoc(doc(db,'codes',$('fcode').value.trim()));
    if(!c.exists())return msg('Code inconnu.');
    const fid=c.data().uid;if(fid===me.id)return msg('C\'est ton propre code.');
    const u=(await getDoc(doc(db,'users',fid))).data();
    await setDoc(doc(db,'users',me.id,'friends',fid),{name:u.name});
    await setDoc(doc(db,'users',fid,'friends',me.id),{name:me.name});
    msg(u.name+' est maintenant ton ami.');$('fcode').value='';loadSocial();
  }catch(e){msg('Erreur : '+e.message)}
};

/* ---------- analyse de partie (Stockfish) ---------- */
const resetAna=()=>{$('ana').innerHTML=''};
const sansOf=()=>G.mode==='bot'?G.sans:(G.row.moves||'').split(' ').filter(Boolean);
const BADGE={brilliant:['Brillant','!!','#1baca6'],best:['Meilleur coup','★','#81b64c'],great:['Très bon coup','!','#5c8bb0'],good:['Bon coup','✓','#8d9b7e'],miss:['Coup raté','?','#e58f2a'],blunder:['Gaffe','??','#ca3431']};
let sf=null;
async function engine(){
  if(sf)return sf;
  const t=await(await fetch('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js')).text();
  sf=new Worker(URL.createObjectURL(new Blob([t],{type:'text/javascript'})));
  sf.postMessage('uci');return sf;
}
function evalPos(fen,depth){
  return new Promise(res=>{
    let cp=0;
    sf.onmessage=e=>{
      const l=typeof e.data==='string'?e.data:'';
      const m=l.match(/^info depth.* score (cp|mate) (-?\d+)/);
      if(m){const v=+m[2];cp=m[1]==='cp'?v:(v>0?10000-v:-10000-v)}
      if(l.startsWith('bestmove'))res({cp,best:l.split(' ')[1]});
    };
    sf.postMessage('position fen '+fen);sf.postMessage('go depth '+depth);
  });
}
const wp=cp=>1/(1+Math.pow(10,-cp/400));
$('analyse').onclick=async()=>{
  const a=$('ana'),sans=sansOf();
  $('analyse').hidden=true;a.textContent='Chargement du moteur…';
  try{await engine()}catch(e){a.textContent='Moteur d\'analyse indisponible (réseau).';return}
  const c=new Chess(),fens=[c.fen()],mv=[];
  for(const s of sans){mv.push(c.move(s));fens.push(c.fen())}
  const ev=[];
  for(let i=0;i<fens.length;i++){
    a.textContent='Analyse '+(i+1)+'/'+fens.length+'…';
    const cc=new Chess(fens[i]);
    const r=cc.game_over()?{cp:cc.in_checkmate()?-10000:0,best:''}:await evalPos(fens[i],10);
    ev.push({cp:cc.turn()==='w'?r.cp:-r.cp,best:r.best});   // évaluation du point de vue des blancs
  }
  const ks=[],bs=[];
  mv.forEach((m,i)=>{
    const pov=m.color==='w'?1:-1,w0=wp(pov*ev[i].cp),w1=wp(pov*ev[i+1].cp),loss=Math.max(0,w0-w1);
    const uci=m.from+m.to+(m.promotion||'');
    let k;
    const after=new Chess(fens[i+1]);
    const sac=V[m.piece]>=300&&V[m.piece]>(m.captured?V[m.captured]:0)&&after.moves({verbose:true}).some(x=>x.to===m.to&&x.captured);
    if(sac&&loss<=.03&&w1>=.45&&w0<.85)k='brilliant';
    else if(uci===ev[i].best||loss<=.005)k='best';
    else if(loss<=.02)k='great';
    else if(loss<=.06)k='good';
    else if(loss<=.2)k='miss';
    else k='blunder';
    ks.push(k);
    try{const b=ev[i].best,t=new Chess(fens[i]);bs.push(b&&b!=='(none)'?t.move({from:b.slice(0,2),to:b.slice(2,4),promotion:b[4]}).san:'')}catch(e){bs.push('')}
  });
  G.fens=fens;G.rv=null;
  a.innerHTML='';
  ['w','b'].forEach(s=>{
    const cnt={};ks.forEach((k,i)=>{if(i%2===(s==='w'?0:1))cnt[k]=(cnt[k]||0)+1});
    const p=document.createElement('div');p.className='small';
    p.textContent=(s==='w'?'Blancs : ':'Noirs : ')+(Object.keys(BADGE).filter(k=>cnt[k]).map(k=>cnt[k]+' '+BADGE[k][0].toLowerCase()).join(', ')||'—');
    a.appendChild(p);
  });
  const note=document.createElement('div');note.className='small';note.textContent='Clique sur un coup pour revoir la position.';
  const list=document.createElement('div');list.className='mvs';
  sans.forEach((s,i)=>{
    if(i%2===0){const n=document.createElement('span');n.className='small';n.textContent=(i/2+1)+'.';list.appendChild(n)}
    const B=BADGE[ks[i]],b=document.createElement('button');b.className='mv';
    b.innerHTML=`${esc(s)} <i style="background:${B[2]}">${B[1]}</i>`;
    b.onclick=()=>{
      G.rv=i+1===sans.length?null:i+1;sel=null;render();
      note.textContent=B[0]+' · évaluation '+(ev[i+1].cp/100).toFixed(1)+(bs[i]&&bs[i]!==s?' · meilleur coup : '+bs[i]:'');
    };
    list.appendChild(b);
  });
  a.appendChild(list);a.appendChild(note);
};

</script></body></html>
